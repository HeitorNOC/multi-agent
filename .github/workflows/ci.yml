name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aurora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Com esta variável, os testes rodam também no PostgreSQL, incluindo os de ponta a ponta
      # com o worker LangGraph real (o modelo é uma CLI falsa; nenhuma conta é usada).
      AURORA_TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/aurora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm run install:all
      - run: npm run setup:runtime
      # Tipos da API e da interface, testes da API nos dois bancos e build da interface.
      - run: npm run verify
